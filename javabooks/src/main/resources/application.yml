server:
  port: 8081

spring:
  application:
    name: book-service

  datasource:
    url: jdbc:h2:mem:bd-books;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: root
    password: root

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        format_sql: true

  profiles:
    active: dev